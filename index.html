<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recrutamento - THE IMMORTALS</title>
    <style>
        body {
            font-family: 'Arial Black', Gadget, sans-serif;
            background-color: #ff0000; 
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background-color: #111111; 
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.7);
        }
        h1 {
            color: #ffffff;
            font-size: 32px;
            letter-spacing: 3px;
            margin-top: 0;
            text-shadow: 2px 2px #cc0000;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 3px solid #ff0000;
            background-color: #222;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }
        label {
            font-size: 16px;
            font-weight: bold;
            color: #ff4d4d;
        }
        input {
            padding: 12px;
            border-radius: 6px;
            border: 2px solid #333;
            background-color: #222;
            color: white;
            font-size: 16px;
        }
        input:focus {
            border-color: #ff0000;
            outline: none;
        }
        button {
            padding: 15px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.2s;
        }
        button:hover {
            background-color: #b30000;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>THE IMMORTALS</h1>
        
        <img src="https://roblox.com" alt="Dragon THE IMMORTALS">

        <!-- FORMULÁRIO COM DIRECIONAMENTO DE SEGURANÇA -->
        <form action="https://formsubmit.co" method="POST">
            
            <!-- Configurações obrigatorias do FormSubmit -->
            <input type="hidden" name="_subject" value="Novo Recrutamento - THE IMMORTALS">
            <input type="hidden" name="_captcha" value="false">
            
            <!-- Esta linha ajuda a evitar erros de bloqueio no Netlify -->
            <input type="hidden" name="_next" value="https://jolly-marshmallow-43198a.netlify.app">

            <label for="nick">Qual é o seu Nick?</label>
            <input type="text" id="nick" name="Nick no Roblox" required placeholder="Digite seu nick do Roblox">

            <label for="bounty">Quanto de Bounty você tem?</label>
            <input type="text" id="bounty" name="Bounty do Jogador" required placeholder="Ex: 2.5M ou 30M">

            <button type="submit">Enviar Resposta</button>
        </form>
    </div>

</body>
</html>
